<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="body-dm">
  <div class="top">
    <span class="back">‹</span>
    <div class="avatar" {{avatar_style}}></div>
    <div class="who"><div class="n">{{brand_name}}</div><div class="h">{{handle}}</div></div>
    <span class="menu">•••</span>
  </div>
  <div class="chat">
    <div class="rrow"><span class="bubble r">{{chat1}}</span></div>
    <div class="rrow"><span class="bubble r">{{chat2}}</span></div>
    <div><span class="bubble l">{{chat3}}</span></div>
    <div><span class="bubble l">{{chat4}}</span></div>
  </div>
  <div class="inputbar">
    <div class="plus">+</div>
    <div class="field">Type a message ...</div>
    <div class="send">➤</div>
  </div>
</body>
</html>
