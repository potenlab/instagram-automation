<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="body-chat-photo">
  <div class="bg" style="background-image:url('{{bg_url}}')"></div>
  <div class="source">{{source}}</div>
  <span class="emoji e1">{{emoji}}</span>
  <div class="chat">
    <div><span class="bubble l">{{chat1}}</span></div>
    <div><span class="bubble l">{{chat2}}</span></div>
    <div class="spacer"></div>
    <div class="rrow"><span class="bubble r">{{chat3}}</span></div>
    <div class="rrow"><span class="bubble r">{{chat4}}</span></div>
  </div>
  <span class="emoji e2">✨</span>
</body>
</html>
