<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="cover-phone">
  <div class="statusbar"><span></span><span class="source">{{source}}</span></div>
  <div class="sub">{{sub}}</div>
  <div class="headline">{{headline}}</div>
  <div class="phone">
    <div class="screen">
      <div class="wallpaper"></div>
      <div class="notif">
        <div class="icon">{{notif1_icon}}</div>
        <div><div class="nt">{{notif1_title}}</div><div class="nd">{{notif1_desc}}</div></div>
        <div class="ntime">지금</div>
      </div>
    </div>
    <div class="island"></div>
  </div>
  <div class="logo-bottom">{{logo_block}}</div>
</body>
</html>
