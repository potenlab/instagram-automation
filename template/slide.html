<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="brand.css">
</head>
<body class="{{role_class}}">
  <div class="bg" style="background-image:url('{{bg_url}}')"></div>
  <div class="frame">
    <div class="topbar">
      {{logo_block}}
      <div class="pagenum">{{page}} / {{total}}</div>
    </div>
    <div class="content">
      {{badge}}
      <div class="headline">{{headline}}</div>
      {{body_block}}
      {{cta_block}}
    </div>
    <div class="footer">
      <div>{{handle}}</div>
      <div class="swipe">{{footer_right}}</div>
    </div>
  </div>
</body>
</html>
