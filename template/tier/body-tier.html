<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="body-tier">
  <div class="top">
    <img class="logo-mark xs" src="../assets/tier-logo.png">
    <span class="badge">TIER GUIDE</span>
  </div>
  <div class="card">
    <div class="grade">{{badge}}</div>
    <div class="dist">{{number}}</div>
    <div class="headline">{{headline}}</div>
    <div class="body">{{body}}</div>
  </div>
  <div class="foot"><span>{{page}} / {{total}}</span><span class="handle">{{handle}}</span></div>
</body>
</html>
