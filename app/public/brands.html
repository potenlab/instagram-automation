<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브랜드 — POTENSTUDIO</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="gridbg"></div>
<div class="shell">
  <aside class="sidebar">
    <a class="wordmark" href="/index.html">
      <div class="glyph">+</div>
      <div class="name">POTEN<span>STUDIO</span></div>
    </a>
    <div class="microlabel">Content Factory</div>
    <a class="nav-item" href="/index.html"><span class="ico"></span>자료함</a>
    <a class="nav-item" href="/queue.html"><span class="ico"></span>대기열</a>
    <a class="nav-item active" href="/brands.html"><span class="ico"></span>브랜드</a>
    <a class="nav-item" href="/settings.html"><span class="ico"></span>설정</a>
    <div class="foot"><span class="dot-live"></span>모든 시스템 정상</div>
  </aside>

  <main class="content">
    <div class="pagehead reveal" style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px">
      <div>
        <div class="microlabel">Brands</div>
        <h1>브랜드</h1>
        <p>브랜드마다 인스타그램 계정 · Discord 채널 · 템플릿을 따로 설정합니다.</p>
      </div>
      <button class="secondary" id="new" style="flex:none">+ 브랜드 추가</button>
    </div>

    <div class="brand-grid reveal d1" id="grid"></div>

    <form id="f" class="panel reveal" style="display:none; max-width:640px; margin-top:22px">
      <div class="microlabel" style="margin-bottom:6px">Edit</div>
      <h1 id="ftitle" style="font-size:19px;font-weight:800;margin-bottom:14px">브랜드 편집</h1>
      <input type="hidden" id="bid">
      <label for="name">이름</label>
      <input type="text" id="name">
      <label for="handle">핸들 <span style="font-weight:500;color:var(--faint)">예: @potenstudio</span></label>
      <input type="text" id="handle">
      <label for="discord_channel_id">Discord 채널 ID</label>
      <input type="text" id="discord_channel_id">
      <label for="zernio_api_key">Zernio API 키 <span style="font-weight:500;color:var(--faint)">이 계정 전용 — 비우면 설정의 기본 키를 씁니다</span></label>
      <input type="text" id="zernio_api_key" placeholder="sk_..." autocomplete="off">
      <label for="ig_account_id">Instagram 계정 <span style="font-weight:500;color:var(--faint)">위 키에 연결된 계정 중 선택</span></label>
      <select id="ig_account_id"><option value="">— 미설정 —</option></select>
      <div id="ighint" style="font-size:12px;color:var(--faint);margin-top:6px"></div>
      <label for="drive_folder_id">Google Drive 폴더 ID <span style="font-weight:500;color:var(--faint)">이 브랜드 자료가 있는 폴더 — 매일 여기서 가져옵니다</span></label>
      <input type="text" id="drive_folder_id" placeholder="1xE-Krx2INGJqkDo8QrOUndWZTbF6mQUt">
      <label for="rss_feeds">RSS 피드 <span style="font-weight:500;color:var(--faint)">쉼표로 구분</span></label>
      <input type="text" id="rss_feeds">
      <label>기본 템플릿 <span style="font-weight:500;color:var(--faint)">이 계정의 카드뉴스 디자인 — 자료함에서 게시물별로 바꿀 수 있어요</span></label>
      <input type="hidden" id="template">
      <div class="brand-pills" id="tplPills"></div>
      <div id="tplPreview" style="display:none;gap:12px;overflow-x:auto;margin-top:12px;padding-bottom:6px"></div>
      <label for="prompt_rules">카피 규칙 <span style="font-weight:500;color:var(--faint)">프롬프트에 추가됨</span></label>
      <textarea id="prompt_rules"></textarea>
      <div style="margin-top:20px; display:flex; gap:10px">
        <button type="submit">저장</button>
        <button type="button" class="secondary" id="cancel">취소</button>
      </div>
      <div class="error" id="err"></div>
    </form>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const FIELDS = ['name', 'handle', 'discord_channel_id', 'ig_account_id', 'rss_feeds', 'template', 'prompt_rules', 'zernio_api_key', 'drive_folder_id'];
let brands = [];

// --- Instagram account select (dari Zernio, per brand) ---
// Key tiap brand bisa beda workspace, jadi daftar akun ikut key yang aktif di form:
// key yang sedang diketik → key tersimpan brand ini → 기본 키 di 설정.
let igReq = 0;

async function loadAccounts(preferred) {
  const sel = $('ig_account_id');
  const want = preferred != null ? preferred : sel.value;
  const key = $('zernio_api_key').value.trim();
  const bid = $('bid').value;
  const q = key && !key.includes('…') ? '?key=' + encodeURIComponent(key)
    : bid ? '?brand_id=' + encodeURIComponent(bid) : '';

  const seq = ++igReq;
  $('ighint').textContent = '계정 불러오는 중…';
  let accounts = [], err = '';
  try {
    const res = await api('/api/zernio/accounts' + q);
    if (res.ok) accounts = await res.json();
    else err = (await res.json().catch(() => ({}))).error || '계정을 불러오지 못했습니다';
  } catch { err = '계정을 불러오지 못했습니다'; }
  if (seq !== igReq) return; // respons lama menyusul — abaikan

  sel.innerHTML = '';
  const none = document.createElement('option');
  none.value = ''; none.textContent = '— 미설정 —';
  sel.appendChild(none);
  for (const a of accounts) {
    const o = document.createElement('option');
    o.value = a.id;
    o.textContent = `${a.username || a.id} (${a.platform || 'instagram'})`;
    sel.appendChild(o);
  }
  syncIgSelect(want);
  $('ighint').textContent = err || (accounts.length ? `${accounts.length}개 계정 연결됨` : '연결된 계정이 없습니다');
}

function syncIgSelect(value) {
  const sel = $('ig_account_id');
  // ID tersimpan tapi tidak ada di daftar (API mati / akun dilepas) → tetap tampilkan raw ID
  if (value && ![...sel.options].some(o => o.value === value)) {
    const o = document.createElement('option');
    o.value = value; o.textContent = value + ' (목록에 없음)';
    sel.appendChild(o);
  }
  sel.value = value || '';
}

// --- template picker (pill + live thumbnail, sama seperti 자료함) ---
let templates = [];
fetch('/api/templates').then(r => r.json())
  .then(list => { templates = list; renderTplPills(); })
  .catch(() => {})
  .finally(load); // brand list tetap tampil walau catalog gagal

const tplName = id => (templates.find(t => t.id === id) || {}).name || id || 'slide.html';

function renderTplPills() {
  const box = $('tplPills');
  box.innerHTML = '';
  const current = $('template').value || 'slide.html';
  for (const t of templates) {
    const p = el('button', 'pill' + (t.id === current ? ' on' : ''), t.name);
    p.type = 'button';
    p.onclick = () => { $('template').value = t.id; renderTplPills(); };
    box.appendChild(p);
  }
  renderTplPreview(current);
}

function renderTplPreview(current) {
  const box = $('tplPreview');
  const t = templates.find(x => x.id === current);
  if (!t || !(t.previews || []).length) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  box.innerHTML = '';
  for (const pv of t.previews) {
    const card = el('div');
    card.style.cssText = 'flex:none;width:162px';
    const frame = el('div');
    frame.style.cssText = 'width:162px;height:203px;overflow:hidden;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#111';
    const ifr = document.createElement('iframe');
    ifr.src = pv.url;
    ifr.loading = 'lazy';
    ifr.style.cssText = 'width:1080px;height:1350px;transform:scale(.15);transform-origin:top left;border:0;pointer-events:none';
    frame.appendChild(ifr);
    const cap = el('div', null, pv.name);
    cap.style.cssText = 'font-size:11px;opacity:.65;margin-top:5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    card.append(frame, cap);
    box.appendChild(card);
  }
}

async function api(url, opts) {
  const res = await fetch(url, opts);
  if (res.status === 401) { location.href = '/login.html'; throw new Error('unauthorized'); }
  return res;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function row(k, v, ok) {
  const r = el('div', 'row');
  r.appendChild(el('span', 'k', k));
  const val = el('span', 'v' + (ok ? ' ok' : ''), v);
  r.appendChild(val);
  return r;
}

async function load() {
  brands = await (await api('/api/brands')).json();
  const grid = $('grid');
  grid.innerHTML = '';
  for (const b of brands) {
    const card = el('div', 'panel hoverable brand-card');
    const name = el('div', 'bname', b.name);
    if (b.handle) {
      const s = document.createElement('small');
      s.textContent = b.handle;
      name.appendChild(s);
    }
    card.appendChild(name);

    const rows = el('div', 'rows');
    rows.appendChild(row('Discord', b.discord_channel_id ? '연결됨' : '미설정', !!b.discord_channel_id));
    rows.appendChild(row('Instagram', b.ig_account_id ? '연결됨' : '미설정', !!b.ig_account_id));
    rows.appendChild(row('Zernio 키', b.zernio_api_key ? '전용' : '기본', !!b.zernio_api_key));
    rows.appendChild(row('Drive', b.drive_folder_id ? '연결됨' : '미설정', !!b.drive_folder_id));
    rows.appendChild(row('RSS', b.rss_feeds ? '활성' : '—', !!b.rss_feeds));
    rows.appendChild(row('템플릿', tplName(b.template)));
    card.appendChild(rows);

    const actions = el('div', 'actions');
    const edit = el('button', 'secondary', '수정'); edit.type = 'button';
    edit.onclick = () => openForm(b);
    const del = el('button', 'danger', '삭제'); del.type = 'button';
    del.onclick = async () => {
      if (!confirm(`"${b.name}" 브랜드를 삭제할까요?`)) return;
      await api('/api/brands/' + b.id, { method: 'DELETE' });
      load();
    };
    actions.appendChild(edit); actions.appendChild(del);
    card.appendChild(actions);
    grid.appendChild(card);
  }
}

function openForm(b) {
  $('f').style.display = '';
  $('ftitle').textContent = b ? '브랜드 편집 — ' + b.name : '브랜드 추가';
  $('bid').value = b ? b.id : '';
  for (const f of FIELDS) $(f).value = b ? (b[f] || '') : (f === 'template' ? 'slide.html' : '');
  loadAccounts(b ? b.ig_account_id || '' : '');
  renderTplPills();
  $('err').textContent = '';
  $('f').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  $('name').focus();
}

$('new').onclick = () => openForm(null);
$('cancel').onclick = () => { $('f').style.display = 'none'; };
$('zernio_api_key').onchange = () => loadAccounts('');

$('f').onsubmit = async (e) => {
  e.preventDefault();
  if (!$('name').value.trim()) { $('err').textContent = '이름을 입력하세요'; return; }
  const body = {};
  for (const f of FIELDS) body[f] = $(f).value.trim();
  const id = $('bid').value;
  const res = await api(id ? '/api/brands/' + id : '/api/brands', {
    method: id ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) { $('err').textContent = (await res.json()).error || '저장 실패'; return; }
  $('f').style.display = 'none';
  load();
};

</script>
</body>
</html>
